# Environment riêng cho worker C2F; không cài setup.py upstream vì pin NumPy cũ.
name: pmc-c2f
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.10
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=11.8
  - pip
  - pip:
      - numpy==1.23.5
      - pillow==9.5.0
      - scipy==1.10.1
      - scikit-image==0.21.0
      - opencv-python==4.8.1.78
      - pyyaml==6.0.1
