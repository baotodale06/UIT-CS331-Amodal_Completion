name: CPU reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Install locked CPU environment
        run: python scripts/setup_cpu.py
      - name: Run Python and Bash regressions and synthetic smoke
        run: |
          source .venv-cpu/bin/activate
          bash scripts/check.sh
      - name: Build source and wheel distributions
        run: .venv-cpu/bin/python -m build --no-isolation
      - name: Check experiment contracts and submission plan
        run: |
          source .venv-cpu/bin/activate
          for config in configs/baseline.json configs/annotated.json configs/lisa-reference.json configs/smoke.json; do
            amodal config "$config" > /dev/null
          done
          amodal plan --config configs/baseline.json --cache-dir .amodal-cache --output-dir output/ci-plan
          git diff --exit-code
